; ╔══════════════════════════════════════════════════════╗
; ║     Smart School IoT - PlatformIO Configuration     ║
; ╚══════════════════════════════════════════════════════╝

[env:esp32dev]
platform    = espressif32
board       = esp32dev
framework   = arduino

; ─── Serial monitor ──────────────────────────────────
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ─── Libraries ───────────────────────────────────────
lib_deps =
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    bblanchon/ArduinoJson @ ^6.21.3

; ─── Build flags ─────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; ─── Upload (Wokwi uses simulation, no real port) ────
upload_speed = 921600
