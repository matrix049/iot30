<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Smart School</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@300;400;500;600&display=swap');

    :root {
      --primary: #58a6ff;
      --secondary: #3fb950;
      --bg-dark: #0d1117;
      --text-white: #ffffff;
      --text-muted: #8b949e;
      --glass: rgba(22, 27, 34, 0.7);
      --glass-border: rgba(48, 54, 61, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background image with overlay */
    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('smart_school_welcome_bg_1777483057897.png');
      background-size: cover;
      background-position: center;
      filter: blur(4px) brightness(0.4);
      z-index: -1;
      transform: scale(1.1);
      animation: zoomIn 20s infinite alternate ease-in-out;
    }

    @keyframes zoomIn {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    /* Floating shapes for dynamic feel */
    .shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      opacity: 0.4;
      animation: float 10s infinite alternate ease-in-out;
    }

    .shape-1 {
      width: 400px;
      height: 400px;
      background: var(--primary);
      top: -100px;
      left: -100px;
    }

    .shape-2 {
      width: 300px;
      height: 300px;
      background: var(--secondary);
      bottom: -50px;
      right: -50px;
      animation-delay: -5s;
    }

    @keyframes float {
      from { transform: translate(0, 0); }
      to { transform: translate(30px, 50px); }
    }

    .container {
      max-width: 800px;
      width: 90%;
      text-align: center;
      z-index: 1;
    }

    .glass-card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 4rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 1s ease-out;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    p {
      font-size: 1.2rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: linear-gradient(135deg, var(--primary) 0%, #3a8dff 100%);
      color: white;
      padding: 1.25rem 2.5rem;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 20px -5px rgba(88, 166, 255, 0.4);
    }

    .btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 20px 30px -10px rgba(88, 166, 255, 0.6);
      background: linear-gradient(135deg, #6cb2ff 0%, var(--primary) 100%);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 20px;
      height: 20px;
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: translateX(4px);
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 3rem;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .feature-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--secondary);
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      h1 { font-size: 2.5rem; }
      .glass-card { padding: 3rem 1.5rem; }
      .features { flex-direction: column; gap: 1rem; align-items: center; }
    }
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>

  <div class="container">
    <div class="glass-card">
      <div class="logo">🏫</div>
      <h1>Welcome to School</h1>
      <p>Bienvenue dans votre interface de gestion intelligente. Gérez les paramètres de vos salles de classe, surveillez l'environnement et assurez le confort de vos élèves en un clic.</p>
      
      <a href="dashboard.html" class="btn">
        Accéder aux paramètres des salles
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
        </svg>
      </a>

      <div class="features">
        <div class="feature-item">
          <div class="feature-dot"></div>
          Surveillance IoT
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          Alertes en Temps Réel
        </div>
        <div class="feature-item">
          <div class="feature-dot"></div>
          Gestion Éco-Énergétique
        </div>
      </div>
    </div>
  </div>

</body>
</html>
